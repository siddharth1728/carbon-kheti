version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: carbon_kheti_postgis
    environment:
      POSTGRES_DB: carbon_kheti
      POSTGRES_USER: ck_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CarbonKhetiPostgres2026!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
